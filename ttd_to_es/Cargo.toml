[package]
name = "ttd-to-es"
version = "0.1.0"
edition = "2024"
description = "Replay a TTD trace and ship every Win32 API call to Elasticsearch"

[dependencies]
ttd           = { version = "0.1.0", path = "../ttd", features = ["replay"] }
anyhow        = "1"
chrono        = "0.4"
elasticsearch = "8.5.0-alpha.1"
env_logger    = "0.11"
log           = "0.4"
serde_json    = "1"
tokio         = { version = "1", features = ["macros", "rt"] }
pelite = "0.10.0"

[lints.rust]
unsafe_code = "forbid"
